server {
    listen 80;
    server_name redlining.research3.org;

    root /var/www/redlining-access-atlas/current;
    index index.html;
    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # These files are gzip archives that the atlas decodes in the browser.
    location ~ \.gz$ {
        gzip off;
        default_type application/gzip;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
